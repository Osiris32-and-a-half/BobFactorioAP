archipelago-show-techs-in-tech-screen-broken-tree=Broken tree
archipelago-show-techs-in-tech-screen-hidden=Hidden

[string-mod-setting-description]
archipelago-progressive-technology-icons-never=Never show multiple icons in any factorio based progressive technologies.
archipelago-progressive-technology-icons-only-own=Only show multiple icons in your own progressive technologies.
archipelago-progressive-technology-icons-always=Always show multiple icons in progressive technologies, regardless of their origin.
archipelago-show-techs-in-tech-screen-tech-tree=Shows all techs that are unlocked by Archipelago. Can be useful to figure out what the mods originally intended for the player to have.
archipelago-show-techs-in-tech-screen-broken-tree=Removes all dependencies of technologies unlocked by Archipelago. Breaking most of the tech tree, but reduces lag. As lag free as "hidden".
archipelago-show-techs-in-tech-screen-hidden=Hides all technologies that are unlocked by Archipelago.


archipelago-show-techs-in-tech-screen-broken-tree=Broken tree
archipelago-show-techs-in-tech-screen-hidden=Hidden

[string-mod-setting-description]
archipelago-progressive-technology-icons-never=Never show multiple icons in any Factorio based progressive technologies.
archipelago-progressive-technology-icons-only-own=Only show multiple icons in your own progressive technologies.
archipelago-progressive-technology-icons-always=Always show multiple icons in progressive technologies, regardless of their origin.
archipelago-show-techs-in-tech-screen-tech-tree=The original tech tree shape is preserved, can be useful to help determine the original progression of the modpack. This can lag enough on medium to large modpacks to crash/disconnect.
archipelago-show-techs-in-tech-screen-broken-tree=Removes all dependencies of technologies unlocked by Archipelago. This helps with lag but breaks the shape of the original tech tree.
archipelago-show-techs-in-tech-screen-hidden=Hides all technologies that are unlocked by Archipelago. Helps as much with lag as the broken tree option.


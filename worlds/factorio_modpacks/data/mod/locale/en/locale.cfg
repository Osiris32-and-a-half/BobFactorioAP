[mod-setting-description]
archipelago-death-link=Kill other players in the same Archipelago Multiworld that also have Death Link turned on, when you die.
archipelago-energy-link=Send and receive power to other players in the same Archipelago Multiworld that also have Energy Link turned on.
archipelago-progressive-technology-icons=The progressive Factorio technologies will have all the icons of the entire progressive series.\nIf there is too much lag when opening the technology screen consider turning this setting down or off.\n\nTo change the setting for the server go to the mods folder and look for a mods-settings.dat file. In that file change the value of this setting in that document.\nInternal values are "never", "only-own" and "always".\nThe other option is to copy the settings from your client to the server.
archipelago-show-techs-in-tech-screen=How the original tech tree is shown, these technologies are unlocked by Archipelago and can be found scattered around the Multiworld. The 'researched by' part tells you which Archipelago item is needed to unlock the technology.\n\nTo change the setting for the server go to the mods folder and look for a mods-settings.dat file. In that file change the value of this setting in that document.\nInternal values are "tech-tree", "broken-tree" and "hidden".\nThe other option is to copy the settings from your client to the server.
archipelago-tech-layer-obscurity=Hide technologies until you have crafted all the science packs for the technology.\nWorks with Depth Obscurity\n\nDuring a run a setting will only affect still hidden techs.
archipelago-tech-depth-obscurity=Hide technologies until you have come with in x amount of techs. 0 to disable.\nWorks with Layer Obscurity\n\nDuring a run a setting will only affect still hidden techs.
archipelago-tech-craft-obscurity=Hide trigger techs based on crafting until you unlock the recipe to craft that item.\n\nDuring a run a setting will only affect still hidden techs.

